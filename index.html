    <style>
        body { 
            background: #121212; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 15px; 
            max-width: 900px; 
            margin: 0 auto;
        }
        h3 { margin-bottom: 10px; font-size: 1.1em; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 10px; 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px; /* Prevents auto-zoom on iOS */
        }
        
        /* Grid for Allies and Enemies */
        .draft-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-bottom: 20px; 
        }
        
        .hero { 
            padding: 15px; 
            background: #1e1e1e; 
            margin-bottom: 10px; 
            border-left: 4px solid #00ff88; 
            border-radius: 4px;
        }
        .hero strong { font-size: 1.15em; }
        
        /* Color coded reasoning */
        .info-text { margin-top: 5px; display: block; font-size: 0.9em; }
        .info-neutral { color: #888; }
        .info-counter { color: #4caf50; }
        .info-weak { color: #f44336; }
        .info-synergy { color: #00bcd4; }
    </style>

        heroes.forEach(h => {
            let option = document.createElement('option');
            option.value = h.name;
            datalist.appendChild(option);
        });

        // 2. Main scoring logic
        function run() {
            const lane = document.getElementById('lane').value;
            
            // Extract typed names and format them to lowercase
            const enemies = Array.from(document.querySelectorAll('.enemy'))
                                 .map(i => i.value.trim().toLowerCase())
                                 .filter(v => v);
                                 
            const allies = Array.from(document.querySelectorAll('.ally'))
                                 .map(i => i.value.trim().toLowerCase())
                                 .filter(v => v);
            
            // Filter by lane
            let valid = lane === "Any" ? heroes : heroes.filter(h => h.roles.includes(lane));
            
            let scored = valid.map(h => {
                let s = enemies.length < 2 ? h.safety : 0; 
                let infoHtml = enemies.length < 2 ? "<span class='info-text info-neutral'>Solid blind pick (low enemy data).</span>" : "";
                
                // Add points for enemies
                enemies.forEach(e => {
                    if(h.counters.includes(e)) { 
                        s += 2; 
                        infoHtml += `<span class='info-text info-counter'>+ Counters ${e.charAt(0).toUpperCase() + e.slice(1)}.</span>`; 
                    }
                    if(h.weak.includes(e)) { 
                        s -= 2; 
                        infoHtml += `<span class='info-text info-weak'>- Weak to ${e.charAt(0).toUpperCase() + e.slice(1)}.</span>`; 
                    }
                });

                // Add points for allies (Synergy)
                allies.forEach(a => {
                    if(h.synergy && h.synergy.includes(a)) {
                        s += 1;
                        infoHtml += `<span class='info-text info-synergy'>★ Synergizes with ${a.charAt(0).toUpperCase() + a.slice(1)}.</span>`;
                    }
                });

                return { ...h, s, info: infoHtml || "<span class='info-text info-neutral'>Neutral matchup.</span>" };
            }).sort((a, b) => b.s - a.s);
            
            // Output top 5 recommendations
            document.getElementById('out').innerHTML = scored.slice(0, 5).map(h => 
                `<div class="hero">
                    <strong>${h.name}</strong> (${h.s} pts)<br>
                    ${h.info}
                </div>`
            ).join('');
        }
        
        run();
